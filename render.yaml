services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: DB_SCHEMA
        value: crud_usuarios
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_SECONDS
        value: 900
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: BREVO_BASE_URL
        value: https://api.brevo.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: Gestion de Usuarios
      - key: BREVO_CONNECT_TIMEOUT
        value: 2
      - key: BREVO_READ_TIMEOUT
        value: 5
      - key: BREVO_RETRY_MAX_ATTEMPTS
        value: 3
      - key: BREVO_RETRY_INITIAL_DELAY
        value: 0.5
      - key: BREVO_RETRY_MULTIPLIER
        value: 2.0
      - key: BREVO_CIRCUIT_FAILURE_THRESHOLD
        value: 50
      - key: BREVO_CIRCUIT_WINDOW_SIZE
        value: 10
      - key: BREVO_CIRCUIT_MINIMUM_CALLS
        value: 5
      - key: BREVO_CIRCUIT_OPEN_DURATION
        value: 30
